name: VYY Robustness and Finite-Size Scaling

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/vyy-robustness.yml'
  workflow_dispatch:
    inputs:
      run_mode:
        description: 'Which test to run'
        required: true
        default: 'all'
        type: choice
        options:
          - hessian_eps
          - seeds
          - finite_size
          - all
      maxiter:
        description: 'Main optimizer max iterations'
        required: true
        default: '600'
      refine_maxiter:
        description: 'Refine optimizer max iterations'
        required: true
        default: '600'

jobs:
  vyy-run:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy

      - name: Reconstruct VYY scripts
        run: |
          python - <<'PY'
          import base64, gzip, pathlib
          data = ''''''
          pathlib.Path('qst_vortex_yy_kernel_v0_3_2.py').write_bytes(gzip.decompress(base64.b64decode(data)))
          PY
          python - <<'PY'
          import base64, gzip, pathlib
          data = ''''''
          pathlib.Path('qst_vortex_yy_hessian_v0_3_3.py').write_bytes(gzip.decompress(base64.b64decode(data)))
          PY
          python - <<'PY'
          import base64, gzip, pathlib
          data = ''''''
          pathlib.Path('qst_vortex_yy_robustness_fss_v0_3_4.py').write_bytes(gzip.decompress(base64.b64decode(data)))
          PY
          chmod +x qst_vortex_yy_kernel_v0_3_2.py qst_vortex_yy_hessian_v0_3_3.py qst_vortex_yy_robustness_fss_v0_3_4.py
          ls -l qst_vortex_yy_*.py

      - name: Run VYY robustness / finite-size scaling
        run: |
          mkdir -p results
          MODE="${{ github.event.inputs.run_mode || 'all' }}"
          MAXITER="${{ github.event.inputs.maxiter || '600' }}"
          REFINE="${{ github.event.inputs.refine_maxiter || '600' }}"
          python qst_vortex_yy_robustness_fss_v0_3_4.py \
            --mode "$MODE" \
            --support_tau 0.7 \
            --maxiter "$MAXITER" \
            --refine_maxiter "$REFINE" \
            --out_prefix results/vyy_v0_3_4_robustness_results

      - name: Upload VYY results
        uses: actions/upload-artifact@v4
        with:
          name: vyy-robustness-results
          path: |
            results/*.csv
            results/*.json
            results/*.md
